[tool.cibuildwheel]
# The following are not even supported in the cibw releases being used so dont
# need to be specified. PyPy was not enabled so does not need to be skipped.
# pp* (PyPy for now)
# cp36-* (Python 3.6)
# cp37-* (Python 3.7)
# Still specify though the 32-bit skips and musl
# *i686 (32-bit builds)
# *win32 (32-bit Windows)
# *musllinux* (No CUDA support)
skip = ["*i686", "*-win32", "*musllinux*"]

# Builds are defined in the ymls for the actions. We use two containers with
# two different cibuildwheel versions to support 3.8 in one, and 3.9-3.15 in the other

# Try to set things up to cache what's possible to make things faster
build-frontend = { name = "pip", args = ["--no-build-isolation"] }

before-build = [
    "python -m pip install -U pip",
    "python -m pip install \"meson>=1.10.1\" meson-python ninja \"pybind11[global]\" setuptools cmake delvewheel",
]

# For C++23 need a newer GCC coming from manylinux_2_28 (GCC 13) and later
# manylinux_2_34 will give GCC 14
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

config-settings = { "setup-args" = ["-Dbuild_core=false", "-Dbuildtype=release"] }

[tool.cibuildwheel.linux]
# The CI YAML pulls cuda-toolkit and determines version.
# Just setup links here.
before-all = [
    # Because MPI....
    "mkdir -p /__w/_temp",
    "cp -a /project/install /__w/_temp/mpich-install",
    """
    if command -v apt-get >/dev/null; then
        apt-get update && apt-get install -y ccache
    elif command -v dnf >/dev/null; then
        if [ "$(uname -m)" = "aarch64" ]; then
            NVIDIA_URL="https://developer.download.nvidia.com/compute/cuda/repos/rhel8/sbsa/cuda-rhel8.repo"
        else
            NVIDIA_URL="https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo"
        fi
        dnf config-manager --add-repo $NVIDIA_URL && dnf clean all && dnf -y install cuda-nvcc-12-8 cuda-cudart-devel-12-8 cuda-nvrtc-devel-12-8 cuda-cccl-12-8 cuda-driver-devel-12-8 cuda-nvml-devel-12-8 libcufile-devel-12-8 --exclude="cccl-13-*"
        ln -sf /usr/local/cuda-12.8 /usr/local/cuda
        dnf install -y epel-release && dnf install -y ccache
    elif command -v yum >/dev/null; then
        yum install -y epel-release && yum install -y ccache
    elif command -v apk >/dev/null; then
        apk add ccache
    fi
    ccache -z
    """,
]
before-build = [
    "python -m pip install -U pip",
    "python -m pip install \"meson>=1.10.1\" meson-python ninja \"pybind11[global]\" setuptools cmake delvewheel",
    "python -m pip install --break-system-packages \"ncarray==0.7.8+cuda128\" --extra-index-url https://pypi.xfelpp.org/cuda128/",
    "python -m pip install --break-system-packages \"sbio==0.3.1+cuda128\" --extra-index-url https://pypi.xfelpp.org/cuda128/",
]

repair-wheel-command = "python utilities/repair_wheel.py {wheel} {dest_dir} --no-exclude-core"

[tool.cibuildwheel.linux.environment]
CC = "ccache gcc"
CXX = "ccache g++"
CCACHE_DIR = "/project/.ccache"
PIP_RETRIES = "20"
CUDA_PATH = "/usr/local/cuda-12.8"
CUDA_HOME = "/usr/local/cuda-12.8"
# MPICH build requires this NVCC variable
NVCC = "/usr/local/cuda-12.8/bin/nvcc"
PATH = "/__w/_temp/mpich-install/bin:/usr/local/cuda-12.8/bin:/usr/local/cuda/bin:$PATH"
LIBRARY_PATH = "/project/install/lib:/project/install/lib64:$LIBRARY_PATH"
LD_LIBRARY_PATH = "/project/install/lib:/project/install/lib64:/usr/local/cuda-12.8/lib64:/usr/local/cuda/lib64:$LD_LIBRARY_PATH"
LDFLAGS = "-Wl,--allow-shlib-undefined -L/project/install/lib -L/project/install/lib64"
MPI_HOME = "/__w/_temp/mpich-install"
PKG_CONFIG_PATH = "/project/install/lib/pkgconfig:/project/install/lib64/pkgconfig:$PKG_CONFIG_PATH"

[tool.cibuildwheel.windows]
config-settings = { "setup-args" = ["-Dcpp_compiler_launcher=", "-Dcuda_compiler_launcher=", "-Dbuild_core=false", "-Dbuildtype=release"] }
before-build = [
    "python -m pip install -U pip",
    "python -m pip install \"meson>=1.10.1\" meson-python ninja \"pybind11[global]\" setuptools cmake delvewheel",
    "python -m pip install --break-system-packages \"ncarray==0.7.8+cuda128\" --extra-index-url https://pypi.xfelpp.org/cuda128/",
    "python -m pip install --break-system-packages \"sbio==0.3.1+cuda128\" --extra-index-url https://pypi.xfelpp.org/cuda128/",
]
repair-wheel-command = "python utilities/repair_wheel_win.py {dest_dir} {wheel} --no-exclude-core"

[tool.cibuildwheel.windows.environment]
PIP_RETRIES = "20"
CUDA_PATH = "C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8"
CUDA_HOME = "C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8"
LIB = "$GITHUB_WORKSPACE/install/lib;$LIB"
PATH = "$GITHUB_WORKSPACE/install/bin;C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8/bin;$PATH"
PreferredToolArchitecture = "x64"
PKG_CONFIG_PATH = "$GITHUB_WORKSPACE/install/lib/pkgconfig;$PKG_CONFIG_PATH"
