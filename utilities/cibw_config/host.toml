[tool.cibuildwheel]
# The following are not even supported in the cibw releases being used so dont
# need to be specified. PyPy was not enabled so does not need to be skipped.
# pp* (PyPy for now)
# cp36-* (Python 3.6)
# cp37-* (Python 3.7)
# Still specify though the 32-bit skips
# *i686 (32-bit builds)
# *win32 (32-bit Windows)
skip = ["*i686", "*-win32"]

# Builds are defined in the ymls for the actions. We use two containers with
# two different cibuildwheel versions to support 3.8 in one, and 3.9-3.15 in the other

# Try to set things up to cache what's possible to make things faster
build-frontend = { name = "pip", args = ["--no-build-isolation"] }

# For C++23 need a newer GCC coming from manylinux_2_28 (GCC 13) and later
# manylinux_2_34 will give GCC 14
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

config-settings = { "setup-args" = ["-Dbuild_core=false", "-Dbuildtype=release"] }

[tool.cibuildwheel.linux]
before-build = [
    "python -m pip install -U pip",
    "python -m pip install \"meson>=1.10.1\" meson-python ninja \"pybind11[global]\" setuptools cmake delvewheel",
    "python -m pip install --break-system-packages \"ncarray==0.7.6+host\" --extra-index-url https://pypi.xfelpp.org/host/",
    "python -m pip install --break-system-packages \"sbio==0.1.4+host\" --extra-index-url https://pypi.xfelpp.org/host/",
]

repair-wheel-command = "python utilities/repair_wheel.py {wheel} {dest_dir} --no-exclude-core"

[tool.cibuildwheel.linux.environment]
CC = "ccache gcc"
CXX = "ccache g++"
CCACHE_DIR = "/project/.ccache"
PIP_RETRIES = "20"
LIBRARY_PATH = "/project/install/lib:/project/install/lib64:$LIBRARY_PATH"
LD_LIBRARY_PATH = "/project/install/lib:/project/install/lib64:$LD_LIBRARY_PATH"
LDFLAGS = "-L/project/install/lib -L/project/install/lib64"
PKG_CONFIG_PATH = "/project/install/lib/pkgconfig:/project/install/lib64/pkgconfig:$PKG_CONFIG_PATH"

[tool.cibuildwheel.macos]
before-all = """
brew install autoconf automake libtool ccache ninja meson cmake python@3.10
export PATH="$HOME/Library/Python/3.10/bin:/opt/homebrew/opt/python@3.10/bin:$PATH"
export PYTHONPATH="$HOME/Library/Python/3.10/lib/python/site-packages:/opt/homebrew/lib/python3.10/site-packages:$PYTHONPATH"
export PYTHON="/opt/homebrew/opt/python@3.10/bin/python3.10"
python3.10 -m pip install --break-system-packages meson ninja "ncarray==0.7.6+host" "sbio==0.1.4+host" --extra-index-url https://pypi.xfelpp.org/host/ || true
"""
before-build = [
    "python -m pip install -U pip",
    "python -m pip install \"meson>=1.10.1\" meson-python ninja \"pybind11[global]\" setuptools cmake delvewheel",
    # This monstrosity is because Python3.8 runs under rosetta and the ARM64/Intel mismatch
    # Despite cibuildwheel creating a macosx_11_0_arm64 wheel for ncarray. It cannot
    # download it with pip.
    "python -m pip install --break-system-packages \"ncarray==0.7.6+host\" --extra-index-url https://pypi.xfelpp.org/host/ --platform macosx_11_0_arm64 --only-binary :all: --target \"$(python -c 'import site; print(site.getsitepackages()[0])')\"",
    "python -m pip install --break-system-packages \"sbio==0.1.4+host\" --extra-index-url https://pypi.xfelpp.org/host/ --platform macosx_11_0_arm64 --only-binary :all: --target \"$(python -c 'import site; print(site.getsitepackages()[0])')\"",
]
repair-wheel-command = "python utilities/repair_wheel.py {wheel} {dest_dir} --require-archs {delocate_archs} --no-exclude-core"


[tool.cibuildwheel.macos.environment]
CC = "ccache clang"
CXX = "ccache clang++"
CCACHE_DIR = ".ccache"
PIP_RETRIES = "20"
MACOSX_DEPLOYMENT_TARGET = "11.0"
# This shim seems to cause issues with Python 3.8 trying to install ncarray
# Since ncarray was built under 11.0, the Python 3.8 compiled with 10.XYZ
# is declared as "too old" so it rrejects the wheel (macosx_11_0_arm64)
SYSTEM_VERSION_COMPAT = "0"
# Not able to find cmake in wheel step otherwise?
PATH = "$PATH:/Applications/CMake.app/Contents/bin:$(pwd)/install/bin:$GITHUB_WORKSPACE/install/bin:/opt/homebrew/bin:/usr/local/bin"
LIBRARY_PATH = "$(pwd)/install/lib:$GITHUB_WORKSPACE/install/lib:$LIBRARY_PATH"
DYLD_LIBRARY_PATH = "$(pwd)/install/lib:$GITHUB_WORKSPACE/install/lib:$DYLD_LIBRARY_PATH"
LDFLAGS = "-L$GITHUB_WORKSPACE/install/lib -L$(pwd)/install/lib"
PKG_CONFIG_PATH = "$(pwd)/install/lib/pkgconfig:$(pwd)/install/share/pkgconfig:$GITHUB_WORKSPACE/install/lib/pkgconfig:$GITHUB_WORKSPACE/install/share/pkgconfig:$PKG_CONFIG_PATH"

[tool.cibuildwheel.windows]
config-settings = { "setup-args" = ["-Dcpp_compiler_launcher=", "-Dcuda_compiler_launcher=", "-Dbuild_core=false", "-Dbuildtype=release"] }
before-build = [
    "python -m pip install -U pip",
    "python -m pip install \"meson>=1.10.1\" meson-python ninja \"pybind11[global]\" setuptools cmake delvewheel",
    "python -m pip install --break-system-packages \"ncarray==0.7.6+host\" --extra-index-url https://pypi.xfelpp.org/host/",
    "python -m pip install --break-system-packages \"sbio==0.1.4+host\" --extra-index-url https://pypi.xfelpp.org/host/",
]
repair-wheel-command = "python utilities/repair_wheel_win.py {dest_dir} {wheel} --no-exclude-core"

[tool.cibuildwheel.windows.environment]
PIP_RETRIES = "20"
LIB = "$GITHUB_WORKSPACE/install/lib;$LIB"
PATH = "$GITHUB_WORKSPACE/install/bin;$PATH"
PreferredToolArchitecture = "x64"
PKG_CONFIG_PATH = "$GITHUB_WORKSPACE/install/lib/pkgconfig;$PKG_CONFIG_PATH"
